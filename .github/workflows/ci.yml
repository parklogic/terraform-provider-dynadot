name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate provider
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Check module dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format, vet, test, and build
        run: make check
      - name: Simulated integration tests
        run: make test-integration
      - name: Check generated documentation
        run: |
          make docs
          test -z "$(git status --porcelain -- docs examples)"
      - name: Install analysis tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Lint
        run: golangci-lint run ./...
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: check
      - name: Build unsigned release snapshot
        run: goreleaser release --snapshot --clean --skip=publish,sign
